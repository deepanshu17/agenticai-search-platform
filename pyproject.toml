[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenticai-search-platform"
version = "0.1.0"
description = "AI-native talent search service with multi-agent orchestration, LangChain pipelines, and MCP-enabled tool calling"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "pydantic==2.11.4",
    "pydantic-settings==2.9.1",
    "python-dotenv==1.1.0",
    "langchain==0.3.25",
    "langchain-core==0.3.81",
    "langchain-openai==0.3.16",
    "langchain-community==0.3.24",
    "mcp==1.23.0",
    "httpx==0.28.1",
    "anyio==4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
    "pytest-mock==3.14.0",
    "httpx==0.28.1",
]

[project.scripts]
talent-search = "src.main:run"
mcp-server = "src.mcp.server:run_server"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"
